<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenTech</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4fdf4;
      text-align: center;
    }

    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      background: url("https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?q=80&w=1000") center/cover;
    }

    h1 {
      font-size: 2.5rem;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: green;
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 1rem;
      cursor: pointer;
    }

    footer {
      background: black;
      color: white;
      padding: 10px;
    }
  </style>
</head>

<body>

  <div class="hero">
    <h1>Salvemos el planeta</h1>
    <p>Únete a GreenTech</p>
    <button>Ayudar</button>
  </div>

  <footer id="footer"></footer>

  <script>
    document.getElementById("footer").textContent =
      "GreenTech © " + new Date().getFullYear();
  </script>

</body>
</html>
